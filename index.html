  <script>
    /* Terapkan pilihan tema sebelum halaman digambar, supaya tidak berkedip. */
    try {
      var t = localStorage.getItem('primbon.tema');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* penyimpanan tidak tersedia */ }
  </script>
  <style>
    html { background: #F4F2EE; }
    @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #121120; } }
    html[data-theme='dark'] { background: #121120; }
  </style>
</head>
